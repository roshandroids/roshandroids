<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="MacOrganizer: a thin SwiftUI app depends on a SwiftPM engine, OrganizerCore, whose services scan, move to Trash, journal every operation and can undo it; nothing is permanently deleted.">
  <defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#34d399"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fbbf24"/></marker></defs>
  <rect width="900" height="400" rx="14" fill="#0f172a"/>
  <g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <rect x="30" y="40" width="300" height="90" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="180.0" y="73" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">MacOrganizer app</text>
  <text x="180.0" y="91" font-size="11" fill="#94a3b8" text-anchor="middle">SwiftUI features</text>
  <text x="180.0" y="107" font-size="11" fill="#94a3b8" text-anchor="middle">thin services, AppEnvironment DI</text>
  <rect x="30" y="200" width="300" height="150" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="180.0" y="255" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">OrganizerCore (SwiftPM)</text>
  <text x="180.0" y="273" font-size="11" fill="#94a3b8" text-anchor="middle">no app dependencies</text>
  <text x="180.0" y="289" font-size="11" fill="#94a3b8" text-anchor="middle">swift test, no Xcode, 57 tests</text>
  <text x="180.0" y="305" font-size="11" fill="#94a3b8" text-anchor="middle">Models, Services, Shared</text>
  <polyline points="180,130 180,198" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ma)"/>
  <text x="190" y="168" font-size="11" fill="#cbd5e1" text-anchor="start">depends on</text>
  <rect x="520" y="24" width="340" height="52" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="690.0" y="46" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">FileScanner</text>
  <text x="690.0" y="64" font-size="11" fill="#94a3b8" text-anchor="middle">read-only scan, PathPolicy</text>
  <rect x="520" y="98" width="340" height="52" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="690.0" y="120" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">ScanReport</text>
  <text x="690.0" y="138" font-size="11" fill="#94a3b8" text-anchor="middle">duplicates, old, large, empty</text>
  <polyline points="690,76 690,97" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ma)"/>
  <rect x="520" y="172" width="340" height="52" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <text x="690.0" y="194" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">MoveExecutor / TrashService</text>
  <text x="690.0" y="212" font-size="11" fill="#94a3b8" text-anchor="middle">move or Trash, never delete</text>
  <polyline points="690,150 690,171" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ma)"/>
  <rect x="520" y="246" width="340" height="52" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="690.0" y="268" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">OperationJournal</text>
  <text x="690.0" y="286" font-size="11" fill="#94a3b8" text-anchor="middle">device + inode, size, mtime</text>
  <polyline points="690,224 690,245" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ma)"/>
  <rect x="520" y="320" width="340" height="52" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="690.0" y="342" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">UndoService</text>
  <text x="690.0" y="360" font-size="11" fill="#94a3b8" text-anchor="middle">History reverses a whole run</text>
  <polyline points="690,298 690,319" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ma)"/>
  <polyline points="330,275 518,275" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#ma)"/>
  <text x="424" y="267" font-size="11" fill="#cbd5e1" text-anchor="middle">the engine is these services</text>
  </g>
</svg>
