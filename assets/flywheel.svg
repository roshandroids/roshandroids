<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" width="900" height="390" role="img" aria-label="Engineering flywheel: enterprise Flutter work surfaces a problem, each project solves it and creates the next one, and AI tooling feeds back into faster delivery.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#34d399"/></marker>
  </defs>
  <rect width="900" height="390" rx="14" fill="#0f172a"/>
  <g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle">
    <!-- row 1 -->
    <rect x="30" y="70" width="200" height="80" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="130" y="103" font-size="14" font-weight="700" fill="#f1f5f9">Enterprise Flutter</text>
    <text x="130" y="124" font-size="11" fill="#94a3b8">production feature delivery</text>
    <rect x="350" y="70" width="200" height="80" rx="10" fill="#1e293b" stroke="#475569"/>
    <text x="450" y="103" font-size="14" font-weight="700" fill="#f1f5f9">Shared packages</text>
    <text x="450" y="124" font-size="11" fill="#94a3b8">shared UI kits · design_theme</text>
    <rect x="670" y="70" width="200" height="80" rx="10" fill="#1e293b" stroke="#475569"/>
    <text x="770" y="103" font-size="14" font-weight="700" fill="#f1f5f9">Document Platform</text>
    <text x="770" y="124" font-size="11" fill="#94a3b8">schema · transactions · codecs</text>
    <!-- row 2 -->
    <rect x="670" y="240" width="200" height="80" rx="10" fill="#1e293b" stroke="#475569"/>
    <text x="770" y="273" font-size="14" font-weight="700" fill="#f1f5f9">Localization tooling</text>
    <text x="770" y="294" font-size="11" fill="#94a3b8">localization analyzer</text>
    <rect x="350" y="240" width="200" height="80" rx="10" fill="#1e293b" stroke="#475569"/>
    <text x="450" y="273" font-size="14" font-weight="700" fill="#f1f5f9">Dev tooling</text>
    <text x="450" y="294" font-size="11" fill="#94a3b8">platform-ci · g · time logger</text>
    <rect x="30" y="240" width="200" height="80" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
    <text x="130" y="273" font-size="14" font-weight="700" fill="#f1f5f9">AI-assisted engineering</text>
    <text x="130" y="294" font-size="11" fill="#94a3b8">AI Tray · agents · brain.md</text>
    <!-- arrows -->
    <g stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#a)">
      <line x1="230" y1="110" x2="348" y2="110"/>
      <line x1="550" y1="110" x2="668" y2="110"/>
      <line x1="770" y1="150" x2="770" y2="238"/>
      <line x1="668" y1="280" x2="552" y2="280"/>
      <line x1="348" y1="280" x2="232" y2="280"/>
    </g>
    <line x1="130" y1="238" x2="130" y2="152" stroke="#34d399" stroke-width="1.8" marker-end="url(#g)"/>
    <g font-size="11" fill="#cbd5e1">
      <text x="289" y="100">same widgets reused</text>
      <text x="609" y="100">packages power editor</text>
      <text x="778" y="200" text-anchor="start">exposes l10n gaps</text>
      <text x="609" y="270">gates need CI</text>
      <text x="289" y="270">agents need tooling</text>
      <text x="138" y="200" text-anchor="start" fill="#34d399">faster delivery</text>
    </g>
    <text x="450" y="200" font-size="12" font-style="italic" fill="#64748b">each project solves a problem the last one exposed</text>
  </g>
</svg>
