<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="log-time: Claude reads the tracker and calendar into data.json, a localhost server shows a week grid, and Refresh or Submit clicks drop request files that a watcher hands back to Claude, which fetches or posts time entries.">
  <defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#34d399"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fbbf24"/></marker></defs>
  <rect width="900" height="330" rx="14" fill="#0f172a"/>
  <g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <rect x="30" y="20" width="170" height="56" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="115.0" y="44" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">Issue tracker, calendar</text>
  <text x="115.0" y="62" font-size="11" fill="#94a3b8" text-anchor="middle">read-only MCP</text>
  <rect x="30" y="120" width="170" height="100" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="115.0" y="158" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">Claude + /log-time</text>
  <text x="115.0" y="176" font-size="11" fill="#94a3b8" text-anchor="middle">fetch, verify,</text>
  <text x="115.0" y="192" font-size="11" fill="#94a3b8" text-anchor="middle">post worklogs</text>
  <polyline points="115,76 115,118" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ma)" marker-start="url(#ma)"/>
  <text x="125" y="102" font-size="11" fill="#cbd5e1" text-anchor="start">reads; posts only on Submit</text>
  <rect x="350" y="120" width="180" height="100" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="440.0" y="158" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">app/data/</text>
  <text x="440.0" y="176" font-size="11" fill="#94a3b8" text-anchor="middle">data.json, status.json</text>
  <text x="440.0" y="192" font-size="11" fill="#94a3b8" text-anchor="middle">requests/, result.json</text>
  <rect x="700" y="120" width="170" height="100" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <text x="785.0" y="158" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">server.js + UI</text>
  <text x="785.0" y="176" font-size="11" fill="#94a3b8" text-anchor="middle">zero-dependency Node</text>
  <text x="785.0" y="192" font-size="11" fill="#94a3b8" text-anchor="middle">127.0.0.1:4783, week grid</text>
  <polyline points="200,152 348,152" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ma)"/>
  <text x="274" y="144" font-size="11" fill="#cbd5e1" text-anchor="middle">build data.json</text>
  <polyline points="532,152 698,152" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ma)"/>
  <text x="615" y="144" font-size="11" fill="#cbd5e1" text-anchor="middle">/api/state</text>
  <polyline points="698,192 532,192" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ma)"/>
  <text x="615" y="210" font-size="11" fill="#cbd5e1" text-anchor="middle">refresh | submit</text>
  <polyline points="348,192 202,192" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ma)"/>
  <text x="274" y="210" font-size="11" fill="#cbd5e1" text-anchor="middle">watch.js: REQUEST</text>
  <text x="450" y="288" font-size="12" font-style="italic" fill="#fbbf24" text-anchor="middle">Nothing is posted to the tracker until you press Submit; Claude re-reads the tracker afterwards to verify.</text>
  </g>
</svg>
