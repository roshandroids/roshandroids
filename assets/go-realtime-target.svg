<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" role="img" aria-label="Planned backend target: two Flutter clients connect over WebSocket to two Go server instances that share messages through Redis Pub/Sub and persist them in PostgreSQL.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="800" height="330" rx="14" fill="#0f172a"/>
  <g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle">
    <rect x="30" y="60" width="140" height="60" rx="10" fill="#1e293b" stroke="#475569"/>
    <text x="100" y="86" font-size="13" font-weight="700" fill="#f1f5f9">Flutter client A</text>
    <text x="100" y="104" font-size="11" fill="#94a3b8">room 1</text>
    <rect x="30" y="200" width="140" height="60" rx="10" fill="#1e293b" stroke="#475569"/>
    <text x="100" y="226" font-size="13" font-weight="700" fill="#f1f5f9">Flutter client B</text>
    <text x="100" y="244" font-size="11" fill="#94a3b8">room 1</text>
    <rect x="320" y="60" width="200" height="60" rx="10" fill="none" stroke="#38bdf8" stroke-dasharray="5 4" stroke-width="1.5"/>
    <text x="420" y="86" font-size="13" font-weight="700" fill="#f1f5f9">Go server 1</text>
    <text x="420" y="104" font-size="11" fill="#94a3b8">hub · rooms · presence</text>
    <rect x="320" y="200" width="200" height="60" rx="10" fill="none" stroke="#38bdf8" stroke-dasharray="5 4" stroke-width="1.5"/>
    <text x="420" y="226" font-size="13" font-weight="700" fill="#f1f5f9">Go server 2</text>
    <text x="420" y="244" font-size="11" fill="#94a3b8">hub · rooms · presence</text>
    <rect x="610" y="125" width="150" height="60" rx="10" fill="none" stroke="#475569" stroke-dasharray="5 4"/>
    <text x="685" y="151" font-size="13" font-weight="700" fill="#f1f5f9">Redis</text>
    <text x="685" y="169" font-size="11" fill="#94a3b8">Pub/Sub between servers</text>
    <rect x="610" y="255" width="150" height="55" rx="10" fill="none" stroke="#475569" stroke-dasharray="5 4"/>
    <text x="685" y="279" font-size="13" font-weight="700" fill="#f1f5f9">PostgreSQL</text>
    <text x="685" y="297" font-size="11" fill="#94a3b8">message history</text>
    <g stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#a)">
      <line x1="170" y1="90" x2="318" y2="90"/>
      <line x1="170" y1="230" x2="318" y2="230"/>
      <line x1="520" y1="98" x2="608" y2="145"/>
      <line x1="608" y1="168" x2="520" y2="215"/>
      <line x1="520" y1="248" x2="608" y2="280"/>
    </g>
    <g font-size="11" fill="#cbd5e1">
      <text x="244" y="82">WebSocket</text>
      <text x="244" y="222">WebSocket</text>
      <text x="580" y="108" text-anchor="end">publish</text>
      <text x="580" y="212" text-anchor="end">deliver</text>
      <text x="570" y="276" text-anchor="end">persist</text>
    </g>
    <text x="400" y="26" font-size="12" font-style="italic" fill="#64748b">dashed = roadmap target, not built yet</text>
  </g>
</svg>
