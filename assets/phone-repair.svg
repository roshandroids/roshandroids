<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="Phone Repair: GoRouter guards screens by session; screens call Riverpod controllers, which call repository interfaces implemented on Supabase; shop, booking, repair-order and payment workflows are still pending.">
  <defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#34d399"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fbbf24"/></marker></defs>
  <rect width="900" height="330" rx="14" fill="#0f172a"/>
  <g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <rect x="10" y="22" width="880" height="48" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="450.0" y="42" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">GoRouter</text>
  <text x="450.0" y="60" font-size="11" fill="#94a3b8" text-anchor="middle">session-aware redirect: signed out goes to sign in</text>
  <rect x="10" y="118" width="120" height="80" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="70.0" y="154" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">Screens</text>
  <text x="70.0" y="172" font-size="11" fill="#94a3b8" text-anchor="middle">auth, devices</text>
  <rect x="200" y="118" width="120" height="80" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="260.0" y="154" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">Controller</text>
  <text x="260.0" y="172" font-size="11" fill="#94a3b8" text-anchor="middle">Riverpod</text>
  <rect x="390" y="118" width="120" height="80" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="450.0" y="154" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">Repository</text>
  <text x="450.0" y="172" font-size="11" fill="#94a3b8" text-anchor="middle">domain interface</text>
  <rect x="580" y="118" width="120" height="80" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="640.0" y="154" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">Supabase impl</text>
  <text x="640.0" y="172" font-size="11" fill="#94a3b8" text-anchor="middle">Auth + Device repos</text>
  <rect x="770" y="118" width="120" height="80" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <text x="830.0" y="154" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">Supabase</text>
  <text x="830.0" y="172" font-size="11" fill="#94a3b8" text-anchor="middle">Auth, Postgres, RLS</text>
  <polyline points="70,70 70,116" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ma)"/>
  <text x="80" y="98" font-size="11" fill="#cbd5e1" text-anchor="start">guards</text>
  <polyline points="130,158 198,158" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ma)"/>
  <text x="164" y="150" font-size="11" fill="#cbd5e1" text-anchor="middle">watch</text>
  <polyline points="320,158 388,158" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ma)"/>
  <text x="354" y="150" font-size="11" fill="#cbd5e1" text-anchor="middle">calls</text>
  <polyline points="510,158 578,158" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ma)"/>
  <text x="544" y="150" font-size="11" fill="#cbd5e1" text-anchor="middle">wraps</text>
  <polyline points="700,158 768,158" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ma)"/>
  <text x="734" y="150" font-size="11" fill="#cbd5e1" text-anchor="middle">queries</text>
  <rect x="580" y="246" width="310" height="56" rx="10" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="735.0" y="270" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">Pending workflows</text>
  <text x="735.0" y="288" font-size="11" fill="#94a3b8" text-anchor="middle">shops, bookings, repair orders, payments, warranty</text>
  <text x="10" y="232" font-size="12" font-style="italic" fill="#64748b" text-anchor="start">roles in profiles: customer, shop, admin (enum, enforced by RLS)</text>
  </g>
</svg>
