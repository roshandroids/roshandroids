<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350" role="img" aria-label="TTS benchmark: a stable phrase corpus is run through every registered engine; unavailable engines are skipped and recorded, available ones synthesize each phrase and write timing, audio info and errors to JSON and CSV.">
  <defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#34d399"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fbbf24"/></marker></defs>
  <rect width="900" height="350" rx="14" fill="#0f172a"/>
  <g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <rect x="30" y="56" width="140" height="80" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="100.0" y="84" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">Phrase corpus</text>
  <text x="100.0" y="102" font-size="11" fill="#94a3b8" text-anchor="middle">phrases.json</text>
  <text x="100.0" y="118" font-size="11" fill="#94a3b8" text-anchor="middle">stable IDs, en + ne</text>
  <rect x="240" y="56" width="140" height="80" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="310.0" y="92" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">BenchmarkRunner</text>
  <text x="310.0" y="110" font-size="11" fill="#94a3b8" text-anchor="middle">one engine at a time</text>
  <rect x="450" y="56" width="140" height="80" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="520.0" y="92" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">check_available()</text>
  <text x="520.0" y="110" font-size="11" fill="#94a3b8" text-anchor="middle">prepare() once</text>
  <rect x="660" y="56" width="210" height="80" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <text x="765.0" y="84" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">synthesize(text)</text>
  <text x="765.0" y="102" font-size="11" fill="#94a3b8" text-anchor="middle">per phrase; Devanagari or</text>
  <text x="765.0" y="118" font-size="11" fill="#94a3b8" text-anchor="middle">Latin tts_text per engine</text>
  <polyline points="170,96 238,96" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ma)"/>
  <text x="204" y="88" font-size="11" fill="#cbd5e1" text-anchor="middle">phrases</text>
  <polyline points="380,96 448,96" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ma)"/>
  <text x="414" y="88" font-size="11" fill="#cbd5e1" text-anchor="middle">engine</text>
  <polyline points="590,96 658,96" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ma)"/>
  <text x="624" y="88" font-size="11" fill="#cbd5e1" text-anchor="middle">yes</text>
  <rect x="450" y="190" width="140" height="56" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="520.0" y="214" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">Skipped</text>
  <text x="520.0" y="232" font-size="11" fill="#94a3b8" text-anchor="middle">unavailable + reason</text>
  <rect x="660" y="190" width="210" height="56" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="765.0" y="214" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">results/&lt;engine&gt;.json + .csv</text>
  <text x="765.0" y="232" font-size="11" fill="#94a3b8" text-anchor="middle">timing, audio info, errors</text>
  <polyline points="520,136 520,188" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ma)"/>
  <text x="530" y="166" font-size="11" fill="#cbd5e1" text-anchor="start">no</text>
  <polyline points="765,136 765,188" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ma)"/>
  <text x="775" y="166" font-size="11" fill="#cbd5e1" text-anchor="start">writes</text>
  <rect x="30" y="286" width="840" height="44" rx="10" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="450.0" y="304" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">Engines behind one TTSAdapter interface</text>
  <text x="450.0" y="322" font-size="11" fill="#94a3b8" text-anchor="middle">dummy, piper, kokoro in-process; qwen3 and chatterbox shell out to their own CLI</text>
  </g>
</svg>
