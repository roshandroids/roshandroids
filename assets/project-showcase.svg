<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="Project showcase: each product repo is the source of truth; an integration definition is validated and compiled into a registry that the Flutter Web showcase renders, while platform-ci publishes private playgrounds into it.">
