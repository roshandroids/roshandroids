  <text x="765.0" y="157" font-size="11" fill="#94a3b8" text-anchor="middle">ProjectShowcaseTemplate</text>
  <polyline points="170,135 238,135" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ma)"/>
