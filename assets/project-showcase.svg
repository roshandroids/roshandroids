  <text x="520.0" y="157" font-size="11" fill="#94a3b8" text-anchor="middle">generate_registry</text>
  <rect x="660" y="90" width="210" height="90" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <text x="765.0" y="123" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">RSProjects Showcase</text>
