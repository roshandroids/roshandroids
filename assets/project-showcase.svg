  <text x="310.0" y="157" font-size="11" fill="#94a3b8" text-anchor="middle">&lt;id&gt;.json</text>
  <rect x="450" y="90" width="140" height="90" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
