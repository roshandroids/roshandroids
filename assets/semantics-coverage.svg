<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350" role="img" aria-label="semantics_coverage: a static source scan and a runtime semantics-tree scan feed one coverage engine; it writes an HTML and JSON report, chunked task lists for agents and a CI gate, and agents fix gaps and trigger a rescan.">
  <defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#34d399"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fbbf24"/></marker></defs>
  <rect width="900" height="350" rx="14" fill="#0f172a"/>
  <g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <rect x="30" y="50" width="190" height="80" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="125.0" y="78" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">Static scan</text>
  <text x="125.0" y="96" font-size="11" fill="#94a3b8" text-anchor="middle">Dart source, parse only</text>
  <text x="125.0" y="112" font-size="11" fill="#94a3b8" text-anchor="middle">~8 s for 750 files</text>
  <rect x="30" y="190" width="190" height="80" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="125.0" y="218" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">Runtime scan</text>
  <text x="125.0" y="236" font-size="11" fill="#94a3b8" text-anchor="middle">live semantics tree</text>
  <text x="125.0" y="252" font-size="11" fill="#94a3b8" text-anchor="middle">in widget tests</text>
  <rect x="290" y="110" width="170" height="100" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="375.0" y="148" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">Coverage engine</text>
  <text x="375.0" y="166" font-size="11" fill="#94a3b8" text-anchor="middle">interactive + structural</text>
  <text x="375.0" y="182" font-size="11" fill="#94a3b8" text-anchor="middle">is the headline %</text>
  <polyline points="220,90 255,90 255,145 288,145" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ma)"/>
  <polyline points="220,230 255,230 255,175 288,175" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ma)"/>
  <rect x="540" y="30" width="160" height="70" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="620.0" y="61" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">HTML + JSON report</text>
  <text x="620.0" y="79" font-size="11" fill="#94a3b8" text-anchor="middle">per widget, per file</text>
  <rect x="540" y="130" width="160" height="70" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <text x="620.0" y="153" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">Agent chunks</text>
  <text x="620.0" y="171" font-size="11" fill="#94a3b8" text-anchor="middle">INDEX.md, RULES.md,</text>
  <text x="620.0" y="187" font-size="11" fill="#94a3b8" text-anchor="middle">one feature folder each</text>
  <rect x="540" y="230" width="160" height="60" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="620.0" y="248" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">CI gate</text>
  <text x="620.0" y="266" font-size="11" fill="#94a3b8" text-anchor="middle">--min-coverage 80</text>
  <text x="620.0" y="282" font-size="11" fill="#94a3b8" text-anchor="middle">exits 1 below it</text>
  <polyline points="460,135 500,135 500,65 538,65" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ma)"/>
  <polyline points="460,160 538,160" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ma)"/>
  <polyline points="460,185 500,185 500,260 538,260" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ma)"/>
  <rect x="760" y="130" width="110" height="70" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="815.0" y="153" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">Agent</text>
  <text x="815.0" y="171" font-size="11" fill="#94a3b8" text-anchor="middle">adds semantics</text>
  <text x="815.0" y="187" font-size="11" fill="#94a3b8" text-anchor="middle">identifiers</text>
  <polyline points="700,165 758,165" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ma)"/>
  <text x="729" y="157" font-size="11" fill="#cbd5e1" text-anchor="middle">tasks</text>
  <polyline points="815,200 815,330 12,330 12,90 28,90" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#ma)"/>
  <text x="400" y="322" font-size="11" fill="#cbd5e1" text-anchor="middle">rescan</text>
  </g>
</svg>
