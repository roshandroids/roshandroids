<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" width="900" height="310" role="img" aria-label="g: a command line argument is routed by a dispatcher to a command that uses branch-name and commit-message rules and then runs the installed git; plain git remains available.">
  <defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#34d399"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fbbf24"/></marker></defs>
  <rect width="900" height="310" rx="14" fill="#0f172a"/>
  <g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <rect x="330" y="14" width="200" height="52" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="430.0" y="36" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">Branch naming</text>
  <text x="430.0" y="54" font-size="11" fill="#94a3b8" text-anchor="middle">PROJ-123-add-search-filter</text>
  <rect x="560" y="14" width="200" height="52" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="660.0" y="36" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">Commit message</text>
  <text x="660.0" y="54" font-size="11" fill="#94a3b8" text-anchor="middle">fix: resolve search crash</text>
  <rect x="30" y="112" width="150" height="80" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="105.0" y="148" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">Terminal</text>
  <text x="105.0" y="166" font-size="11" fill="#94a3b8" text-anchor="middle">g new PROJ-123 "..."</text>
  <rect x="240" y="112" width="130" height="80" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="305.0" y="148" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">Dispatcher</text>
  <text x="305.0" y="166" font-size="11" fill="#94a3b8" text-anchor="middle">command registry</text>
  <rect x="430" y="112" width="150" height="80" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="505.0" y="140" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">Command</text>
  <text x="505.0" y="158" font-size="11" fill="#94a3b8" text-anchor="middle">new, commit, push,</text>
  <text x="505.0" y="174" font-size="11" fill="#94a3b8" text-anchor="middle">switch, sync, status</text>
  <rect x="640" y="112" width="230" height="80" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <text x="755.0" y="140" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">git client</text>
  <text x="755.0" y="158" font-size="11" fill="#94a3b8" text-anchor="middle">wraps the installed git;</text>
  <text x="755.0" y="174" font-size="11" fill="#94a3b8" text-anchor="middle">short output back to you</text>
  <polyline points="180,152 238,152" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ma)"/>
  <text x="209" y="144" font-size="11" fill="#cbd5e1" text-anchor="middle">argv</text>
  <polyline points="370,152 428,152" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ma)"/>
  <text x="399" y="144" font-size="11" fill="#cbd5e1" text-anchor="middle">route</text>
  <polyline points="580,152 638,152" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ma)"/>
  <text x="609" y="144" font-size="11" fill="#cbd5e1" text-anchor="middle">exec</text>
  <polyline points="470,66 490,110" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ma)"/>
  <text x="458" y="92" font-size="11" fill="#cbd5e1" text-anchor="end">names</text>
  <polyline points="640,66 540,110" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ma)"/>
  <text x="626" y="92" font-size="11" fill="#cbd5e1" text-anchor="start">formats</text>
  <polyline points="105,192 105,262 755,262 755,194" fill="none" stroke="#fbbf24" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#mo)"/>
  <text x="430" y="254" font-size="11" fill="#fbbf24" text-anchor="middle">native git still works as the escape hatch</text>
  </g>
</svg>
