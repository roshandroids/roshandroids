<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="AI Tray: provider adapters turn Claude CLI output and a Copilot SDK sidecar into validated usage, a repository caches it, and notifiers drive the tray rings; a second path reads Claude session files and queues budget-capped resumes.">
  <defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#34d399"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fbbf24"/></marker></defs>
  <rect width="900" height="320" rx="14" fill="#0f172a"/>
  <g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <rect x="30" y="40" width="140" height="56" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="100.0" y="64" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">Claude CLI</text>
  <text x="100.0" y="82" font-size="11" fill="#94a3b8" text-anchor="middle">/usage output</text>
  <rect x="30" y="112" width="140" height="56" rx="10" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="100.0" y="136" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">Copilot SDK</text>
  <text x="100.0" y="154" font-size="11" fill="#94a3b8" text-anchor="middle">sidecar, experimental</text>
  <rect x="230" y="52" width="170" height="100" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="315.0" y="90" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">Provider adapter</text>
  <text x="315.0" y="108" font-size="11" fill="#94a3b8" text-anchor="middle">AiProviderPort</text>
  <text x="315.0" y="124" font-size="11" fill="#94a3b8" text-anchor="middle">run, parse, validate</text>
  <rect x="460" y="52" width="160" height="100" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="540.0" y="90" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">UsageRepository</text>
  <text x="540.0" y="108" font-size="11" fill="#94a3b8" text-anchor="middle">refresh service</text>
  <text x="540.0" y="124" font-size="11" fill="#94a3b8" text-anchor="middle">usage cache, settings</text>
  <rect x="680" y="52" width="190" height="100" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <text x="775.0" y="90" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">Tray + popup</text>
  <text x="775.0" y="108" font-size="11" fill="#94a3b8" text-anchor="middle">session / week rings</text>
  <text x="775.0" y="124" font-size="11" fill="#94a3b8" text-anchor="middle">provider health</text>
  <polyline points="170,68 200,68 200,92 228,92" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ma)"/>
  <text x="182" y="60" font-size="11" fill="#cbd5e1" text-anchor="middle">stdout</text>
  <polyline points="170,140 200,140 200,114 228,114" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ma)"/>
  <text x="182" y="158" font-size="11" fill="#cbd5e1" text-anchor="middle">quota</text>
  <polyline points="400,102 458,102" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ma)"/>
  <text x="429" y="94" font-size="11" fill="#cbd5e1" text-anchor="middle">usage</text>
  <polyline points="620,102 678,102" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ma)"/>
  <text x="649" y="94" font-size="11" fill="#cbd5e1" text-anchor="middle">state</text>
  <rect x="30" y="218" width="140" height="70" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="100.0" y="241" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">~/.claude/projects</text>
  <text x="100.0" y="259" font-size="11" fill="#94a3b8" text-anchor="middle">read directly,</text>
  <text x="100.0" y="275" font-size="11" fill="#94a3b8" text-anchor="middle">no new database</text>
  <rect x="230" y="218" width="170" height="70" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="315.0" y="249" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">Session browser</text>
  <text x="315.0" y="267" font-size="11" fill="#94a3b8" text-anchor="middle">list, resume by hand</text>
  <rect x="460" y="218" width="160" height="70" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="540.0" y="249" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">Queued resume</text>
  <text x="540.0" y="267" font-size="11" fill="#94a3b8" text-anchor="middle">mandatory budget cap</text>
  <rect x="680" y="218" width="190" height="70" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="775.0" y="241" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">Notification</text>
  <text x="775.0" y="259" font-size="11" fill="#94a3b8" text-anchor="middle">click to jump to</text>
  <text x="775.0" y="275" font-size="11" fill="#94a3b8" text-anchor="middle">that session</text>
  <polyline points="170,253 228,253" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ma)"/>
  <text x="199" y="245" font-size="11" fill="#cbd5e1" text-anchor="middle">reads</text>
  <polyline points="400,253 458,253" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ma)"/>
  <text x="429" y="245" font-size="11" fill="#cbd5e1" text-anchor="middle">queue</text>
  <polyline points="620,253 678,253" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ma)"/>
  <text x="649" y="245" font-size="11" fill="#cbd5e1" text-anchor="middle">on done</text>
  </g>
</svg>
