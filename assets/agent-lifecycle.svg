<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="A coordinator agent only routes a ticket to four specialist agents in sequence: investigate, implement, review, open PR; review can send work back to implement; all agents read one shared skill set.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fbbf24"/></marker>
  </defs>
  <rect width="900" height="340" rx="14" fill="#0f172a"/>
  <g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle">
    <!-- coordinator -->
    <rect x="40" y="26" width="820" height="50" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="450" y="48" font-size="14" font-weight="700" fill="#f1f5f9">coordinator</text>
    <text x="450" y="66" font-size="11" fill="#94a3b8">ticket in · PR out · routes only, never investigates or codes</text>
    <!-- dashed delegation -->
    <g stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4 4" fill="none" marker-end="url(#a)">
      <line x1="120" y1="76" x2="120" y2="128"/>
      <line x1="340" y1="76" x2="340" y2="128"/>
      <line x1="560" y1="76" x2="560" y2="128"/>
      <line x1="780" y1="76" x2="780" y2="128"/>
    </g>
    <!-- steps -->
    <g fill="#1e293b" stroke="#475569">
      <rect x="40" y="130" width="160" height="80" rx="10"/>
      <rect x="260" y="130" width="160" height="80" rx="10"/>
      <rect x="480" y="130" width="160" height="80" rx="10"/>
      <rect x="700" y="130" width="160" height="80" rx="10"/>
    </g>
    <g font-size="14" font-weight="700" fill="#f1f5f9">
      <text x="120" y="163">Investigate</text>
      <text x="340" y="163">Implement</text>
      <text x="560" y="163">Review</text>
      <text x="780" y="163">Open PR</text>
    </g>
    <g font-size="11" fill="#94a3b8">
      <text x="120" y="184">technical-analyst</text>
      <text x="120" y="198">local code, then KB search</text>
      <text x="340" y="184">flutter-developer</text>
      <text x="340" y="198">Riverpod · doc comments</text>
      <text x="560" y="184">code-reviewer</text>
      <text x="560" y="198">callers + conventions</text>
      <text x="780" y="184">pr-coordinator</text>
      <text x="780" y="198">subtask · title · reviewer</text>
    </g>
    <!-- forward arrows -->
    <g stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#a)">
      <line x1="200" y1="170" x2="258" y2="170"/>
      <line x1="420" y1="170" x2="478" y2="170"/>
      <line x1="640" y1="170" x2="698" y2="170"/>
    </g>
    <g font-size="11" fill="#cbd5e1">
      <text x="230" y="162">plan</text>
      <text x="450" y="162">diff</text>
      <text x="670" y="162">ok</text>
    </g>
    <!-- feedback loop -->
    <polyline points="560,210 560,240 340,240 340,212" fill="none" stroke="#fbbf24" stroke-width="1.6" marker-end="url(#o)"/>
    <text x="450" y="233" font-size="11" fill="#fbbf24">changes requested</text>
    <!-- shared skills -->
    <rect x="40" y="268" width="820" height="46" rx="10" fill="none" stroke="#475569" stroke-dasharray="5 4"/>
    <text x="450" y="288" font-size="12" font-weight="700" fill="#f1f5f9">one shared skill set, read by every agent</text>
    <text x="450" y="305" font-size="11" fill="#94a3b8">coding standards · knowledge-graph lookup · PR conventions</text>
  </g>
</svg>
