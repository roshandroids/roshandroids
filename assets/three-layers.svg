<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="Three layers: products use shared packages, packages are extracted from products, and tooling builds, gates and tests both.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#34d399"/></marker>
  </defs>
  <rect width="900" height="360" rx="14" fill="#0f172a"/>
  <g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle">
    <rect x="40" y="30" width="560" height="80" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="320" y="56" font-size="14" font-weight="700" fill="#f1f5f9">Product</text>
    <text x="320" y="78" font-size="11" fill="#94a3b8">Enterprise Flutter apps · AI Tray · Phone Repair</text>
    <text x="320" y="94" font-size="11" fill="#94a3b8">CELPIP Workspace · MacOrganizer</text>
    <rect x="40" y="140" width="560" height="80" rx="10" fill="#1e293b" stroke="#475569"/>
    <text x="320" y="166" font-size="14" font-weight="700" fill="#f1f5f9">Packages</text>
    <text x="320" y="188" font-size="11" fill="#94a3b8">shared UI kits · design_theme</text>
    <text x="320" y="204" font-size="11" fill="#94a3b8">Document Platform modules (schema, transactions, codecs)</text>
    <rect x="40" y="250" width="560" height="80" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
    <text x="320" y="276" font-size="14" font-weight="700" fill="#f1f5f9">Tooling</text>
    <text x="320" y="298" font-size="11" fill="#94a3b8">platform-ci · localization analyzer · g</text>
    <text x="320" y="314" font-size="11" fill="#94a3b8">agentic_flutter_template · brain.md · agents</text>
    <!-- product <-> packages -->
    <line x1="250" y1="110" x2="250" y2="138" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)" transform="translate(0 0)"/>
    <line x1="390" y1="138" x2="390" y2="112" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="244" y="128" font-size="11" fill="#cbd5e1" text-anchor="end">uses</text>
    <text x="396" y="128" font-size="11" fill="#cbd5e1" text-anchor="start">extracted from</text>
    <!-- tooling gates both -->
    <path d="M600 290 H650 V70 H602" fill="none" stroke="#34d399" stroke-width="1.6" marker-end="url(#g)"/>
    <path d="M600 290 H650 V180 H602" fill="none" stroke="#34d399" stroke-width="1.6" marker-end="url(#g)"/>
    <text x="662" y="190" font-size="11" fill="#34d399" text-anchor="start">builds, lints, gates</text>
    <text x="662" y="206" font-size="11" fill="#34d399" text-anchor="start">and tests both layers</text>
    <text x="662" y="300" font-size="11" fill="#64748b" text-anchor="start">so the next feature ships faster</text>
  </g>
</svg>
