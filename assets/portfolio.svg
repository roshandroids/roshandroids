<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Portfolio site: GitHub metrics synced daily as static JSON plus content feed a React, Vite and TypeScript app; a push to main deploys to Firebase Hosting and a pull request gets a preview channel.">
  <defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#34d399"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fbbf24"/></marker></defs>
  <rect width="900" height="300" rx="14" fill="#0f172a"/>
  <g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <rect x="30" y="40" width="190" height="80" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="125.0" y="68" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">GitHub metrics</text>
  <text x="125.0" y="86" font-size="11" fill="#94a3b8" text-anchor="middle">static JSON,</text>
  <text x="125.0" y="102" font-size="11" fill="#94a3b8" text-anchor="middle">synced daily</text>
  <rect x="30" y="160" width="190" height="80" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="125.0" y="188" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">Content</text>
  <text x="125.0" y="206" font-size="11" fill="#94a3b8" text-anchor="middle">case studies with</text>
  <text x="125.0" y="222" font-size="11" fill="#94a3b8" text-anchor="middle">SVG architecture diagrams</text>
  <rect x="290" y="90" width="200" height="110" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="390.0" y="125" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">React 19 + Vite + TS</text>
  <text x="390.0" y="143" font-size="11" fill="#94a3b8" text-anchor="middle">Tailwind, Framer Motion</text>
  <text x="390.0" y="159" font-size="11" fill="#94a3b8" text-anchor="middle">terminal hero, command</text>
  <text x="390.0" y="175" font-size="11" fill="#94a3b8" text-anchor="middle">palette, hidden /terminal</text>
  <rect x="580" y="40" width="290" height="80" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <text x="725.0" y="76" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">Firebase Hosting</text>
  <text x="725.0" y="94" font-size="11" fill="#94a3b8" text-anchor="middle">roshanshrestha.rsprojects.dev</text>
  <rect x="580" y="160" width="290" height="80" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="725.0" y="196" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">Preview channel</text>
  <text x="725.0" y="214" font-size="11" fill="#94a3b8" text-anchor="middle">one per pull request</text>
  <polyline points="220,80 255,80 255,125 288,125" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ma)"/>
  <text x="262" y="72" font-size="11" fill="#cbd5e1" text-anchor="start">data</text>
  <polyline points="220,200 255,200 255,165 288,165" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ma)"/>
  <text x="262" y="224" font-size="11" fill="#cbd5e1" text-anchor="start">pages</text>
  <polyline points="490,125 535,125 535,80 578,80" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ma)"/>
  <text x="535" y="70" font-size="11" fill="#cbd5e1" text-anchor="middle">push to main</text>
  <polyline points="490,165 535,165 535,200 578,200" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ma)"/>
  <text x="535" y="224" font-size="11" fill="#cbd5e1" text-anchor="middle">pull request</text>
  </g>
</svg>
